<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Simple photo edit sequence</title><desc id="desc">A four-step workflow moves from crop to light to color and then stops.</desc>
  <rect width="900" height="520" fill="#dceaff"/>
  <g font-family="Arial, sans-serif" font-weight="800"><text x="76" y="79" fill="#ff5c35" font-size="18" letter-spacing="2">A SMALL EDIT, IN ORDER</text></g>
  <g transform="translate(76 150)"><g><rect width="166" height="190" fill="#f7f8f8" stroke="#151515" stroke-width="4"/><rect x="28" y="28" width="110" height="110" fill="#a8c7e7"/><path d="M28 138 138 28" stroke="#ff5c35" stroke-width="6"/><text x="83" y="169" text-anchor="middle" fill="#151515" font-family="Arial, sans-serif" font-size="20" font-weight="800">1. CROP</text></g><path d="M185 95h43" stroke="#2347f5" stroke-width="5"/><path d="M222 85l15 10-15 10" fill="none" stroke="#2347f5" stroke-width="5"/><g transform="translate(248)"><rect width="166" height="190" fill="#f7f8f8" stroke="#151515" stroke-width="4"/><circle cx="83" cy="77" r="40" fill="#ffb15d"/><path d="M36 131h94" stroke="#2347f5" stroke-width="8"/><text x="83" y="169" text-anchor="middle" fill="#151515" font-family="Arial, sans-serif" font-size="20" font-weight="800">2. LIGHT</text></g><path d="M433 95h43" stroke="#2347f5" stroke-width="5"/><path d="M470 85l15 10-15 10" fill="none" stroke="#2347f5" stroke-width="5"/><g transform="translate(496)"><rect width="166" height="190" fill="#f7f8f8" stroke="#151515" stroke-width="4"/><circle cx="59" cy="82" r="34" fill="#ff5c35"/><circle cx="108" cy="82" r="34" fill="#2347f5" opacity=".85"/><text x="83" y="169" text-anchor="middle" fill="#151515" font-family="Arial, sans-serif" font-size="20" font-weight="800">3. COLOR</text></g><path d="M681 95h43" stroke="#2347f5" stroke-width="5"/><path d="M718 85l15 10-15 10" fill="none" stroke="#2347f5" stroke-width="5"/><g transform="translate(744)"><rect width="80" height="190" fill="#151515"/><text x="40" y="93" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="800">STOP</text><text x="40" y="120" text-anchor="middle" fill="#ff5c35" font-family="Arial, sans-serif" font-size="18" font-weight="800">4</text></g></g>
</svg>
