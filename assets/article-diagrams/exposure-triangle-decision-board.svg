<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Exposure triangle decision board</title>
  <desc id="desc">Three photographic goals show which exposure control to consider first and what trade-off to observe.</desc>
  <defs>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7edff"/><stop offset="1" stop-color="#6faee8"/></linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2dc"/><stop offset="1" stop-color="#f6b06e"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#293a64"/><stop offset="1" stop-color="#0f1831"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#f8f7f2"/>
  <rect x="42" y="38" width="1116" height="684" rx="10" fill="#fff" stroke="#d4d9dd" stroke-width="2"/>
  <text x="82" y="92" fill="#ff5c35" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="3">START WITH THE RESULT YOU WANT</text>
  <text x="82" y="143" fill="#151515" font-family="Georgia, serif" font-size="43" font-weight="700">Choose the first control that answers the question.</text>
  <path d="M82 177h1036" stroke="#d4d9dd" stroke-width="2"/>

  <g transform="translate(82 220)">
    <rect width="320" height="384" rx="8" fill="#f6fbff" stroke="#c8d9ee" stroke-width="2"/>
    <rect x="18" y="18" width="284" height="148" rx="5" fill="url(#action)"/>
    <path d="M33 140c58-42 124-50 235-15" fill="none" stroke="#7fae6b" stroke-width="18" stroke-linecap="round"/>
    <g fill="none" stroke="#173c71" stroke-width="7" stroke-linecap="round"><circle cx="111" cy="121" r="25"/><circle cx="180" cy="121" r="25"/><path d="M111 121l31-49 38 49m-38-49 17-30 36 14m-53 16h44"/></g>
    <path d="M222 73h50m-17-15 17 15-17 15" fill="none" stroke="#2347f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="208" fill="#151515" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">GOAL 01</text>
    <text x="18" y="243" fill="#151515" font-family="Arial, sans-serif" font-size="27" font-weight="800">Freeze motion</text>
    <rect x="18" y="268" width="147" height="43" rx="21" fill="#2347f5"/>
    <text x="91" y="296" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="800">SHUTTER SPEED</text>
    <text x="18" y="344" fill="#5e6670" font-family="Arial, sans-serif" font-size="17">Then check:</text>
    <text x="18" y="370" fill="#151515" font-family="Arial, sans-serif" font-size="18" font-weight="700">brightness + ISO</text>
  </g>

  <g transform="translate(440 220)">
    <rect width="320" height="384" rx="8" fill="#fffaf2" stroke="#f0c794" stroke-width="2"/>
    <rect x="18" y="18" width="284" height="148" rx="5" fill="url(#portrait)"/>
    <g filter="url(#soft)" fill="#f6cd99" opacity=".75"><circle cx="76" cy="68" r="24"/><circle cx="250" cy="54" r="31"/><circle cx="248" cy="121" r="28"/></g>
    <circle cx="155" cy="87" r="43" fill="#151515"/><circle cx="155" cy="75" r="21" fill="#f4b07b"/><path d="M111 145c14-42 75-42 88 0" fill="#2347f5"/>
    <circle cx="155" cy="87" r="58" fill="none" stroke="#ff5c35" stroke-width="5" stroke-dasharray="8 7"/>
    <text x="18" y="208" fill="#151515" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">GOAL 02</text>
    <text x="18" y="243" fill="#151515" font-family="Arial, sans-serif" font-size="27" font-weight="800">Soften background</text>
    <rect x="18" y="268" width="112" height="43" rx="21" fill="#ff5c35"/>
    <text x="74" y="296" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="800">APERTURE</text>
    <text x="18" y="344" fill="#5e6670" font-family="Arial, sans-serif" font-size="17">Then check:</text>
    <text x="18" y="370" fill="#151515" font-family="Arial, sans-serif" font-size="18" font-weight="700">focus + depth</text>
  </g>

  <g transform="translate(798 220)">
    <rect width="320" height="384" rx="8" fill="#f6f8ff" stroke="#b6c7f0" stroke-width="2"/>
    <rect x="18" y="18" width="284" height="148" rx="5" fill="url(#night)"/>
    <circle cx="244" cy="56" r="23" fill="#fff4c7"/><circle cx="253" cy="47" r="23" fill="#1d294b"/>
    <rect x="66" y="71" width="64" height="75" fill="#3f5f9a"/><rect x="143" y="93" width="55" height="53" fill="#49689e"/><path d="M36 146h248" stroke="#6277a4" stroke-width="6"/>
    <g fill="#b9dfff"><rect x="77" y="84" width="15" height="17"/><rect x="104" y="84" width="15" height="17"/><rect x="154" y="105" width="14" height="16"/><rect x="177" y="105" width="14" height="16"/></g>
    <text x="18" y="208" fill="#151515" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">GOAL 03</text>
    <text x="18" y="243" fill="#151515" font-family="Arial, sans-serif" font-size="27" font-weight="800">Keep the frame bright</text>
    <rect x="18" y="268" width="68" height="43" rx="21" fill="#173c71"/>
    <text x="52" y="296" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="800">ISO</text>
    <text x="18" y="344" fill="#5e6670" font-family="Arial, sans-serif" font-size="17">Then check:</text>
    <text x="18" y="370" fill="#151515" font-family="Arial, sans-serif" font-size="18" font-weight="700">noise + detail</text>
  </g>

  <g transform="translate(82 655)"><circle cx="12" cy="-6" r="6" fill="#2347f5"/><text x="28" y="0" fill="#3b526b" font-family="Arial, sans-serif" font-size="17">One scene can need different first controls. Name the visible result before changing a setting.</text></g>
</svg>
