  <g fill="none" stroke="#2347f5" stroke-width="5" stroke-linecap="round"><path d="M231 213c42-91 150-125 242-75"/><path d="M505 140c87 42 119 146 70 237"/><path d="M569 405c-78 61-190 43-246-39"/><path d="M289 349c-75-72-69-187 12-252"/></g>
  <g fill="#f7f8f8" stroke="#151515" stroke-width="4"><circle cx="450" cy="109" r="72"/><circle cx="654" cy="260" r="72"/><circle cx="450" cy="410" r="72"/><circle cx="246" cy="260" r="72"/></g>
